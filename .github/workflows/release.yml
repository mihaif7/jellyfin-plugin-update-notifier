name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 1.0.0.0'
        required: true

permissions:
  contents: write

env:
  PROJECT: src/Jellyfin.Plugin.UpdateNotifier/Jellyfin.Plugin.UpdateNotifier.csproj
  ASSEMBLY: Jellyfin.Plugin.UpdateNotifier.dll
  OUT_DIR: src/Jellyfin.Plugin.UpdateNotifier/bin/Release/net10.0
  # One build, offered once per server generation: an entry only reaches
  # servers at or above its targetAbi, and the universal repo badges an entry
  # by an exact match. Add the next one here when a Jellyfin minor ships.
  TARGET_ABIS: '12.1.0.0 12.0.0.0'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      # Values from the event are passed through env rather than interpolated
      # into the script, so a crafted tag or release body cannot inject shell.
      - name: Resolve version
        id: v
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_VERSION:-}" ]; then
            VERSION="$INPUT_VERSION"
            TAG="v${VERSION}"
          else
            TAG="$GITHUB_REF_NAME"
            VERSION="${TAG#v}"
          fi
          case "$VERSION" in
            *[!0-9.]*|'') echo "Refusing to release malformed version: $VERSION" >&2; exit 1 ;;
          esac
          # Jellyfin compares four-part versions, so pad 1.2.3 to 1.2.3.0.
          while [ "$(printf '%s' "$VERSION" | tr -cd '.' | wc -c)" -lt 3 ]; do
            VERSION="${VERSION}.0"
          done
          {
            echo "version=$VERSION"
            echo "tag=$TAG"
          } >> "$GITHUB_OUTPUT"

      - name: Ensure the release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi

      # A release body serves two audiences. Everything above the marker is
      # written for people running the plugin, and is what Jellyfin shows in the
      # catalog and on the Plugin Updates page, so it becomes the changelog.
      # Below it sits the commit and contributor detail GitHub generates, which
      # stays on the release page. A body with no marker is used whole.
      - name: Read release notes
        id: notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --json body -q .body > release-body.txt
          awk '/<!-- manifest-end -->/{exit} {print}' release-body.txt > release-notes.txt
          [ -s release-notes.txt ] || printf 'Release %s.' "${TAG#v}" > release-notes.txt

      - name: Stamp version
        env:
          V: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          sed -i -E "s|<Version>[0-9.]+</Version>|<Version>${V}</Version>|;
                     s|<AssemblyVersion>[0-9.]+</AssemblyVersion>|<AssemblyVersion>${V}</AssemblyVersion>|;
                     s|<FileVersion>[0-9.]+</FileVersion>|<FileVersion>${V}</FileVersion>|" src/Directory.Build.props

      - name: Build
        run: dotnet build "$PROJECT" --configuration Release

      - name: Package
        env:
          V: ${{ steps.v.outputs.version }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          set -euo pipefail
          TS="$(date -u +%Y-%m-%dT%H:%M:%S.0000000Z)"

          DIST="$GITHUB_WORKSPACE/dist"
          mkdir -p "$DIST"
          : > "$DIST/versions.json"

          for ABI in $TARGET_ABIS; do
            SHORT="${ABI%.*.*}"
            ZIP="updatenotifier_${V}_${SHORT}.zip"

            # Descriptive fields come from manifest.json, the single source of
            # truth. --rawfile keeps the notes as data, never as shell.
            jq --arg v "$V" --arg ts "$TS" --arg abi "$ABI" --arg dll "$ASSEMBLY" \
               --rawfile log release-notes.txt '
               .[0] | {
                 category, description, guid, name, overview, owner,
                 changelog: $log,
                 targetAbi: $abi,
                 timestamp: $ts,
                 version: $v,
                 status: "Active",
                 autoUpdate: true,
                 assemblies: [$dll]
               }' manifest.json > "$OUT_DIR/meta.json"

            # Create the archive with a relative name inside the output dir, then
            # move it: the runner's zip mishandles an absolute archive path.
            ( cd "$OUT_DIR" && rm -f "$ZIP" && zip -j "$ZIP" "$ASSEMBLY" meta.json )
            mv "$OUT_DIR/$ZIP" "$DIST/$ZIP"
            test -f "$DIST/$ZIP"

            URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${ZIP}"
            jq -n --arg v "$V" --arg abi "$ABI" --arg url "$URL" --arg ts "$TS" \
                  --arg sum "$(md5sum "$DIST/$ZIP" | cut -d' ' -f1)" \
                  --rawfile log release-notes.txt '
                  {
                    version: $v, changelog: $log, targetAbi: $abi,
                    sourceUrl: $url, checksum: $sum, timestamp: $ts
                  }' >> "$DIST/versions.json"
          done

      # This version's entries replace any already carrying it, so re-releasing
      # a tag is idempotent. Older versions keep only their lowest-abi build,
      # which every server that could install them can still install.
      - name: Update manifest.json
        env:
          V: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          jq --arg v "$V" --slurpfile new "$GITHUB_WORKSPACE/dist/versions.json" '
             .[0].versions =
               ($new
                + (.[0].versions
                   | map(select(.version != $v))
                   | group_by(.version)
                   | map(sort_by(.targetAbi | split(".") | map(tonumber)) | first)
                   | sort_by(.timestamp)
                   | reverse))' \
             manifest.json > manifest.tmp
          mv manifest.tmp manifest.json

      - name: Commit the release metadata
        env:
          V: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add manifest.json src/Directory.Build.props
          git diff --staged --quiet || git commit -m "chore(release): ${V}"
          git push origin main

      - name: Attach the zips to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.v.outputs.tag }}
        run: gh release upload "$TAG" "$GITHUB_WORKSPACE"/dist/*.zip --clobber
